<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Highlight Coffee | Premium Menu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root { --pumpkin: #FD802E; --bg: #0f1215; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        html, body { background: var(--bg); color: white; overflow-x: hidden; width: 100%; }

        /* --- Navbar --- */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 8%; position: fixed; width: 100%; top: 0; z-index: 1000; background: rgba(15, 18, 21, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 24px; font-weight: 800; color: white; text-decoration: none; }
        .logo span { color: var(--pumpkin); }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .call-link { color: #aaa; text-decoration: none; font-weight: bold; font-size: 14px; }
        .cart-status { background: var(--pumpkin); color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* --- Hero Section (Desktop View) --- */
        .hero { height: 100vh; display: flex; align-items: center; justify-content: space-between; padding: 0 10%; background: radial-gradient(circle at 80% 20%, #1a1e23, transparent); }
        .hero-text { flex: 1; text-align: left; }
        .hero-text h1 { font-size: 75px; line-height: 1.1; font-weight: 800; margin: 20px 0; }
        .hero-img-container { flex: 1; display: flex; justify-content: flex-end; }
        .hero-img { width: 450px; height: 450px; border-radius: 40px; border: 3px solid var(--pumpkin); padding: 10px; object-fit: cover; }

        /* --- Search --- */
        .controls { padding: 40px 10%; }
        .search-box { position: relative; max-width: 500px; width: 100%; }
        .search-box input { width: 100%; padding: 15px 15px 15px 50px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: #1a1e23; color: white; outline: none; font-size: 16px; }
        .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--pumpkin); }

        /* --- Product Grid & Interactions --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; padding: 0 10% 100px; }
        .product-card { position: relative; background: #1a1e23; border-radius: 30px; overflow: hidden; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255,255,255,0.05); }
        .img-container { width: 100%; height: 380px; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
        .card-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px; background: linear-gradient(to top, rgba(0,0,0,0.95) 30%, transparent); backdrop-filter: blur(2px); transition: 0.4s; }
        .price-tag { font-size: 20px; font-weight: 800; color: var(--pumpkin); margin-bottom: 10px; display: block; }
        .card-overlay p { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 20px; opacity: 0; transform: translateY(20px); transition: 0.4s; }
        .add-btn { width: 100%; background: white; color: black; border: none; padding: 14px; border-radius: 15px; font-weight: 800; transform: translateY(40px); opacity: 0; transition: 0.5s; cursor: pointer; }

        .product-card:hover .img-container img, .product-card.active .img-container img { transform: scale(1.1); }
        .product-card:hover, .product-card.active { transform: translateY(-15px); border-color: var(--pumpkin); }
        .product-card:hover .card-overlay p, .product-card.active .card-overlay p { opacity: 1; transform: translateY(0); }
        .product-card:hover .add-btn, .product-card.active .add-btn { transform: translateY(0); opacity: 1; }

        /* --- Floating SMS/iMessage Button --- */
        .sms-btn { position: fixed; bottom: 30px; right: 30px; background: #34C759; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 20px rgba(0,0,0,0.4); z-index: 2000; text-decoration: none; transition: 0.3s; }
        .sms-btn:hover { transform: scale(1.1); background: #28a745; }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .hero { flex-direction: column; height: auto; padding: 120px 5% 40px; text-align: center; }
            .hero-text h1 { font-size: 45px; }
            .hero-img { width: 300px; height: 300px; margin-top: 30px; }
            .card-overlay p, .add-btn { opacity: 1; transform: translateY(0); }
            .grid { padding: 0 5% 80px; }
        }

        .footer { background: #080a0c; padding: 60px 10%; border-top: 1px solid #1a1e23; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 40px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">Highlight<span>.</span></a>
        <div class="nav-right">
            <a href="tel:+18182414700" class="call-link"><i class="fa fa-phone"></i> (818) 241-4700</a>
            <div class="cart-status" onclick="checkout()">Cart: <span id="count">0</span></div>
        </div>
    </nav>

    <a href="sms:+18182414700&body=Hi Highlight Coffee! I'm interested in your menu." class="sms-btn">
        <i class="fa-solid fa-comment-sms"></i>
    </a>

    <header class="hero">
        <div class="hero-text" data-aos="fade-right">
            <p style="color:var(--pumpkin); font-weight:bold;">/ PREMIUM QUALITY</p>
            <h1>Bold Brews,<br><span style="color:var(--pumpkin)">Fine Time.</span></h1>
            <p style="color:#888;">Modern Specialty Coffee in Glendale & Pasadena.</p>
        </div>
        <div class="hero-img-container" data-aos="zoom-in">
            <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800" class="hero-img">
        </div>
    </header>

    <section class="controls">
        <div class="search-box" data-aos="fade-up">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search menu..." onkeyup="searchProducts()">
        </div>
    </section>

    <div id="grid" class="grid" data-aos="fade-up"></div>

    <footer class="footer">
        <div class="footer-grid">
            <div><h4 style="color:var(--pumpkin)">GLENDALE</h4><p>701 E Broadway, CA 91205</p></div>
            <div><h4 style="color:var(--pumpkin)">PASADENA</h4><p>2071 Lincoln Ave, CA 91103</p></div>
            <div style="text-align:right">
                <a href="https://instagram.com/highlightcoffee" target="_blank" style="color:#ff4d4d; font-size:40px;"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000 });
        let cart = [];
        const products = [
            { id: 1, name: "Butterscotch Latte", price: 6.5, img: "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=600", desc: "Signature latte with house-made syrup." },
            { id: 2, name: "Pistachio Danish", price: 4.9, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600", desc: "Flaky layers with premium pistachios." },
            { id: 3, name: "Nitro Cold Brew", price: 5.5, img: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=600", desc: "Smooth nitrogen infused caffeine." },
            { id: 4, name: "Spanish Latte", price: 6.0, img: "https://images.unsplash.com/photo-1541167760496-162955ed8a9f?w=600", desc: "Espresso with sweet condensed milk." },
            { id: 5, name: "Almond Croissant", price: 4.5, img: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600", desc: "Golden croissant with almond cream." }
        ];

        function searchProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('grid');
            const filtered = products.filter(p => p.name.toLowerCase().includes(term));
            container.innerHTML = filtered.map(p => `
                <div class="product-card" ontouchstart="this.classList.add('active')" ontouchend="setTimeout(()=>this.classList.remove('active'), 1500)">
                    <div class="img-container"><img src="${p.img}"></div>
                    <div class="card-overlay">
                        <h3>${p.name}</h3><span class="price-tag">$${p.price.toFixed(2)}</span>
                        <p>${p.desc}</p><button class="add-btn" onclick="addToCart(${p.id})">Add to Order</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            document.getElementById('count').innerText = cart.length;
            event.stopPropagation();
        }

        function checkout() {
            if(cart.length === 0) return alert("Cart is empty!");
            // ارسال سفارش از طریق پیامک
            const text = encodeURIComponent("Order Details:\n" + cart.map(i=>i.name).join("\n"));
            window.open(`sms:+18182414700&body=${text}`);
        }
        searchProducts();
    </script>
</body>
</html>
