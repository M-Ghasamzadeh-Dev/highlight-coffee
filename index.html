<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight Coffee | Exact UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --pumpkin: #FD802E; --bg: #1a1a1a; --card-bg: #242424; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: white; padding-bottom: 50px; }

        /* Navbar */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: transparent; }
        .logo { font-size: 24px; font-weight: 800; color: white; text-decoration: none; }
        .logo span { color: var(--pumpkin); }
        .nav-right { display: flex; gap: 20px; align-items: center; }
        .cart-status { background: var(--pumpkin); color: white; padding: 10px 25px; border-radius: 50px; font-weight: bold; text-decoration: none; }

        /* Hero */
        .hero { display: flex; align-items: center; padding: 40px 8%; gap: 30px; }
        .hero-content { flex: 1; }
        .hero-content h4 { color: #888; font-size: 12px; letter-spacing: 2px; margin-bottom: 10px; }
        .hero-content h1 { font-size: 50px; font-weight: 800; line-height: 1.1; margin-bottom: 15px; }
        .hero-content p { color: #aaa; font-size: 14px; max-width: 350px; margin-bottom: 20px; }
        .hero-img-box { width: 320px; height: 320px; border: 3px solid var(--pumpkin); border-radius: 40px; padding: 12px; }
        .hero-img-box img { width: 100%; height: 100%; object-fit: cover; border-radius: 30px; }

        /* Quick Filters */
        .quick-filters { display: flex; gap: 10px; padding: 0 8% 30px; }
        .q-btn { border: none; padding: 8px 18px; border-radius: 50px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .q-btn.dark { background: #333; color: white; }
        .q-btn.orange { background: var(--pumpkin); color: white; }
        .q-btn.outline { background: white; color: black; }

        /* Controls Section */
        .controls-header { padding: 30px 8%; border-top: 1px solid #333; }
        .search-row { display: flex; gap: 10px; margin-top: 15px; }
        .search-bar { flex: 1; background: white; border-radius: 8px; display: flex; align-items: center; padding: 0 15px; }
        .search-bar input { border: none; padding: 12px; width: 100%; outline: none; }
        .search-bar i { color: #666; }
        .filter-sq { background: #444; width: 45px; height: 45px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

        /* Main Content Layout */
        .main-layout { display: flex; gap: 30px; padding: 0 8%; margin-top: 40px; }
        
        /* Left Info Card */
        .info-panel { width: 250px; }
        .guide-card { background: #2a2a2a; border-radius: 30px; padding: 25px; border: 1px solid #333; text-align: center; }
        .guide-card h2 { font-size: 32px; text-align: left; margin-bottom: 20px; }
        .guide-card .price-box { background: transparent; border: 2px solid #444; border-radius: 20px; padding: 20px; margin-bottom: 15px; }
        .guide-card .price-box h3 { color: var(--pumpkin); font-size: 28px; }
        .guide-card img { width: 80px; margin: 10px 0; }

        /* Products Grid */
        .products-column { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .p-card { background: #222; border-radius: 30px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .p-card:hover { border-color: var(--pumpkin); }
        .p-card img { width: 100%; height: 250px; object-fit: cover; }
        .p-info { padding: 20px; }
        .p-price { color: var(--pumpkin); font-weight: 800; font-size: 20px; }
        .p-info h4 { margin: 5px 0; font-size: 16px; }
        .p-info p { color: #777; font-size: 12px; margin-bottom: 15px; }
        .add-btn-small { width: 100%; background: white; border: none; padding: 10px; border-radius: 12px; font-weight: 800; cursor: pointer; }

        /* Floating SMS */
        .sms-float { position: fixed; bottom: 20px; right: 20px; background: #00E676; color: white; width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; text-decoration: none; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }

        /* Mobile */
        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; }
            .main-layout { flex-direction: column; }
            .info-panel { width: 100%; }
            .hero-img-box { width: 250px; height: 250px; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">Highlight<span>.</span></a>
        <div class="nav-right">
            <a href="#" style="color:#aaa; text-decoration:none; font-size:12px;">Call-link</a>
            <a href="#" class="cart-status">Cart Status</a>
        </div>
    </nav>

    <section class="hero">
        <div class="hero-content">
            <h4>HERO</h4>
            <h1>Latte Batter Scatch<br>Wooight 10.1 0</h1>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor.</p>
            <button class="q-btn orange">Sample Btn</button>
        </div>
        <div class="hero-img-box">
            <img src="https://images.unsplash.com/photo-1541167760496-162955ed8a9f?w=600" alt="Coffee">
        </div>
    </section>

    <div class="quick-filters">
        <button class="q-btn dark">All</button>
        <button class="q-btn orange">All</button>
        <button class="q-btn outline">Drinks</button>
        <button class="q-btn outline">Food</button>
    </div>

    <section class="controls-header">
        <h3>Controls & Filters</h3>
        <div class="search-row">
            <div class="search-bar">
                <i class="fa fa-search"></i>
                <input type="text" placeholder="Search">
            </div>
            <div class="filter-sq"><i class="fa fa-th-large"></i></div>
        </div>
    </section>

    <div class="main-layout">
        <aside class="info-panel">
            <div class="guide-card">
                <h2>Grid</h2>
                <div class="price-box">
                    <h3>$100</h3>
                    <p style="color:#888; font-size:12px;">Price</p>
                    <img src="https://cdn-icons-png.flaticon.com/512/1665/1665727.png" alt="Hand">
                </div>
                <button class="add-btn-small">Add Btn</button>
            </div>
        </aside>

        <main class="products-column">
            <div class="p-card">
                <img src="https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=600">
                <div class="p-info">
                    <span class="p-price">$10.000</span>
                    <h4>Cled Brou</h4>
                    <p>High quality coffee beans...</p>
                    <button class="add-btn-small">Add Btn</button>
                </div>
            </div>
            <div class="p-card">
                <img src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600">
                <div class="p-info">
                    <span class="p-price">$04 Brou</span>
                    <h4>Croissant</h4>
                    <p>Freshly baked every morning...</p>
                    <button class="add-btn-small">Add Btn</button>
                </div>
            </div>
        </main>
    </div>

    <a href="sms:+18182414700?body=Hi" class="sms-float">
        <i class="fa-solid fa-comment-dots"></i>
    </a>

</body>
</html>
