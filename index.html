<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Highlight Coffee | Premium Menu</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        :root { --charcoal: #233D4C; --pumpkin: #FD802E; --bg: #0f1215; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: white; overflow-x: hidden; }

        /* --- Navbar (ثابت) --- */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 8%; position: fixed; width: 100%; top: 0; z-index: 1000; background: rgba(15, 18, 21, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 24px; font-weight: 800; color: white; text-decoration: none; }
        .logo span { color: var(--pumpkin); }
        .nav-right { display: flex; align-items: center; gap: 20px; }
        .call-link { color: #aaa; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.3s; }
        .cart-status { background: var(--pumpkin); color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }

        /* --- Hero (ثابت) --- */
        .hero { height: 100vh; display: flex; align-items: center; justify-content: space-around; padding: 0 10%; background: radial-gradient(circle at 80% 20%, #1a1e23, transparent); }
        .hero-text h1 { font-size: clamp(45px, 6vw, 75px); line-height: 1.1; margin-bottom: 20px; font-weight: 800; }
        .hero-img { width: 450px; border-radius: 40px; border: 3px solid var(--pumpkin); padding: 10px; object-fit: cover; height: 450px; }

        /* --- Search & Filters (بخش جدید و شیک) --- */
        .controls { padding: 120px 10% 40px; display: flex; flex-direction: column; gap: 25px; }
        .search-box { position: relative; max-width: 500px; }
        .search-box input { width: 100%; padding: 15px 25px 15px 50px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); background: #1a1e23; color: white; font-size: 16px; outline: none; transition: 0.3s; }
        .search-box input:focus { border-color: var(--pumpkin); box-shadow: 0 0 15px rgba(253, 128, 46, 0.2); }
        .search-box i { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: var(--pumpkin); }

        .filter-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-btn { padding: 10px 20px; border-radius: 50px; border: none; background: #1a1e23; color: white; cursor: pointer; font-weight: 600; transition: 0.3s; border: 1px solid transparent; }
        .filter-btn.active { background: var(--pumpkin); border-color: var(--pumpkin); }
        .filter-btn:hover:not(.active) { border-color: var(--pumpkin); }

        /* --- Product Grid (ثابت) --- */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; padding: 0 10% 100px; min-height: 400px; }
        .product-card { position: relative; background: #1a1e23; border-radius: 30px; overflow: hidden; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255,255,255,0.05); }
        .img-container { width: 100%; height: 380px; overflow: hidden; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s; }
        .card-overlay { position: absolute; bottom: 0; left: 0; right: 0; padding: 30px; background: linear-gradient(to top, rgba(0,0,0,0.95) 30%, transparent); backdrop-filter: blur(2px); transition: all 0.4s; }
        .product-card:hover .img-container img { transform: scale(1.1); }
        .product-card:hover { transform: translateY(-15px); border-color: var(--pumpkin); }
        .card-overlay h3 { font-size: 24px; font-weight: 800; }
        .price-tag { font-size: 20px; font-weight: 800; color: var(--pumpkin); margin-bottom: 10px; display: block; }
        .card-overlay p { font-size: 14px; color: rgba(255,255,255,0.7); margin-bottom: 20px; opacity: 0; transform: translateY(20px); transition: 0.4s; }
        .product-card:hover .card-overlay p { opacity: 1; transform: translateY(0); }
        .add-btn { width: 100%; background: white; color: black; border: none; padding: 14px; border-radius: 15px; font-weight: 800; cursor: pointer; transform: translateY(40px); opacity: 0; transition: 0.5s; }
        .product-card:hover .add-btn { transform: translateY(0); opacity: 1; }

        /* --- Footer (ثابت) --- */
        .footer { background: #080a0c; padding: 60px 10%; border-top: 1px solid #1a1e23; }
        .footer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; }
        .insta-icon { font-size: 50px; color: #ff4d4d; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">Highlight<span>.</span></a>
        <div class="nav-right">
            <a href="tel:+18185551925" class="call-link"><i class="fa fa-phone"></i> (818) 555-1925</a>
            <div class="cart-status" onclick="checkout()"><i class="fa fa-shopping-basket"></i> Cart: <span id="count">0</span></div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-text" data-aos="fade-right">
            <p style="color:var(--pumpkin); font-weight:bold; letter-spacing: 2px;">/ EST 1925</p>
            <h1>Bold Brews,<br><span style="color:var(--pumpkin)">Fine Time.</span></h1>
        </div>
        <img src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=800" class="hero-img" data-aos="zoom-in">
    </header>

    <section class="controls">
        <div class="search-box" data-aos="fade-up">
            <i class="fa fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search your favorite coffee..." onkeyup="searchProducts()">
        </div>
        <div class="filter-group" data-aos="fade-up">
            <button class="filter-btn active" onclick="filter('all', this)">All Menu</button>
            <button class="filter-btn" onclick="filter('drink', this)">Drinks</button>
            <button class="filter-btn" onclick="filter('food', this)">Pastries</button>
        </div>
    </section>

    <div id="grid" class="grid" data-aos="fade-up"></div>

    <footer class="footer">
        <div class="footer-grid">
            <div><h4 style="color:var(--pumpkin)">GLENDALE</h4><p>701 E Broadway, CA 91205</p></div>
            <div><h4 style="color:var(--pumpkin)">PASADENA</h4><p>2071 Lincoln Ave, CA 91103</p></div>
            <div style="text-align:right"><a href="https://instagram.com/highlightcoffee" target="_blank" class="insta-icon"><i class="fab fa-instagram"></i></a></div>
        </div>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 1000 });
        let cart = [];
        let currentCategory = 'all';
        const products = [
            { id: 1, cat: 'drink', name: "Butterscotch Latte", price: 6.5, img: "https://images.unsplash.com/photo-1570968915860-54d5c301fa9f?w=600", desc: "Signature latte with house-made butterscotch syrup." },
            { id: 2, cat: 'food', name: "Pistachio Danish", price: 4.9, img: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600", desc: "Flaky layers with premium pistachios." },
            { id: 3, cat: 'drink', name: "Nitro Cold Brew", price: 5.5, img: "https://images.unsplash.com/photo-1461023058943-07fcbe16d735?w=600", desc: "Smooth nitrogen infused caffeine." },
            { id: 4, cat: 'drink', name: "Spanish Latte", price: 6.0, img: "https://hotmart.s3.amazonaws.com/product_pictures/b3e04bd8-9ee7-4196-bb16-752f9ccd9ac8/Storyparainstagramdebomdiacomcafecoloridomarromepreto.png", desc: "Classic espresso with sweet condensed milk." },
            { id: 5, cat: 'food', name: "Almond Croissant", price: 4.5, img: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600", desc: "Golden croissant with almond cream." },
            { id: 6, cat: 'food', name: "Berry Scone", price: 4.2, img: "https://images.unsplash.com/photo-1481391243133-f96216dcb5d2?w=600", desc: "Fresh baked daily with seasonal berries." }
        ];

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            document.getElementById('count').innerText = cart.length;
        }

        function checkout() {
            if(cart.length === 0) return alert("Cart is empty!");
            window.open(`https://wa.me/18185551925?text=${encodeURIComponent("New Order:\n" + cart.map(i=>i.name).join("\n"))}`);
        }

        function filter(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentCategory = cat;
            searchProducts(); // ترکیب فیلتر و جستجو
        }

        function searchProducts() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const container = document.getElementById('grid');
            
            const filtered = products.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(term);
                const matchesCat = currentCategory === 'all' || p.cat === currentCategory;
                return matchesSearch && matchesCat;
            });

            container.innerHTML = filtered.map(p => `
                <div class="product-card">
                    <div class="img-container"><img src="${p.img}" alt="${p.name}"></div>
                    <div class="card-overlay">
                        <h3>${p.name}</h3>
                        <span class="price-tag">$${p.price.toFixed(2)}</span>
                        <p>${p.desc}</p>
                        <button class="add-btn" onclick="addToCart(${p.id})">Add to Order</button>
                    </div>
                </div>
            `).join('');
            
            if(filtered.length === 0) container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; padding: 50px; color: #888;">No products found...</p>`;
        }

        render = searchProducts; // مقداردهی اولیه
        render();
    </script>
</body>
</html>
